<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dimaag Ki Battery — Quiz</title>
<meta name="description" content="Hindi aur English mein khela jaane wala fun unlimited quiz game — 12 categories, 300+ questions, sound effects aur high score ke saath.">
<meta name="theme-color" content="#12163B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo+Black&family=Inter:wght@400;500;600&display=swap');

  :root{
    --navy:#12163B;
    --navy-deep:#0B0E29;
    --gold:#FFC145;
    --coral:#FF5D5D;
    --mint:#3FDDB0;
    --ink:#F3F1FF;
    --muted:#9BA0C9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(circle at 50% -10%, #1E2260 0%, var(--navy) 45%, var(--navy-deep) 100%);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:16px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .app{
    width:100%;
    max-width:420px;
    position:relative;
  }

  /* ---------- START SCREEN ---------- */
  .screen{ display:none; }
  .screen.active{ display:block; animation:fadeUp .5s ease both; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .start-card{
    text-align:center;
    padding:36px 24px 30px;
    position:relative;
  }
  .top-controls{
    position:absolute;
    top:0; right:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .icon-toggle{
    width:32px; height:32px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    color:var(--ink);
    font-size:14px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .lang-toggle{
    display:flex;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:20px;
    padding:3px;
    gap:2px;
  }
  .lives-row{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:14px;
    font-size:18px;
  }
  .high-score-row{
    text-align:center;
    font-family:'Space Grotesk';
    font-size:11.5px;
    color:var(--gold);
    letter-spacing:1px;
    text-transform:uppercase;
    margin:-8px 0 12px;
  }
  .life-heart{ transition:transform .2s ease; }
  .life-heart.lost{ opacity:0.25; transform:scale(0.85); filter:grayscale(1); }
  .life-heart.shake{ animation:heartShake .4s ease; }
  @keyframes heartShake{
    0%,100%{ transform:scale(1); }
    30%{ transform:scale(1.3) rotate(-8deg); }
    60%{ transform:scale(0.9) rotate(8deg); }
  }
  .lang-btn{
    border:none;
    background:transparent;
    color:var(--muted);
    font-family:'Space Grotesk';
    font-weight:700;
    font-size:12px;
    padding:6px 12px;
    border-radius:16px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .lang-btn.selected{
    background:var(--gold);
    color:var(--navy-deep);
  }
  .bolt{
    font-size:56px;
    display:inline-block;
    filter:drop-shadow(0 0 18px rgba(255,193,69,.6));
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }

  h1.title{
    font-family:'Archivo Black', sans-serif;
    font-size:34px;
    line-height:1.05;
    margin:14px 0 6px;
    letter-spacing:-0.5px;
  }
  h1.title span{ color:var(--gold); }
  .subtitle{
    color:var(--muted);
    font-size:15px;
    margin:0 0 28px;
    font-weight:500;
  }

  .cat-label{
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--mint);
    margin-bottom:10px;
    font-weight:700;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-bottom:18px;
    max-height:44vh;
    overflow-y:auto;
    padding:2px 2px 6px;
  }
  .cat-grid::-webkit-scrollbar{ width:4px; }
  .cat-grid::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.2); border-radius:4px; }
  .cat-btn{
    position:relative;
    aspect-ratio:3/4.2;
    border:2px solid rgba(255,255,255,0.1);
    border-radius:16px;
    padding:0;
    cursor:pointer;
    overflow:hidden;
    transition:transform .18s ease, border-color .18s ease;
    background:#1a1e4d;
  }
  .cat-btn:active{ transform:scale(0.96); }
  .cat-btn .poster-art{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background-size:cover;
  }
  .cat-btn .poster-icon{
    font-size:30px;
    margin-bottom:6px;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));
  }
  .cat-btn .poster-title{
    font-family:'Archivo Black', sans-serif;
    font-size:11.5px;
    line-height:1.2;
    color:#fff;
    text-align:center;
    padding:0 6px;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
    text-transform:uppercase;
    letter-spacing:0.3px;
  }
  .cat-btn .poster-tag{
    font-family:'Space Grotesk';
    font-size:8.5px;
    color:rgba(255,255,255,0.75);
    margin-top:3px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .cat-btn .poster-sheen{
    position:absolute; inset:0;
    background:linear-gradient(160deg, rgba(255,255,255,0.16) 0%, transparent 35%),
               linear-gradient(0deg, rgba(0,0,0,0.35) 0%, transparent 40%);
    pointer-events:none;
  }
  .cat-btn .poster-band{
    position:absolute; top:8px; left:-26px;
    background:var(--gold);
    color:var(--navy-deep);
    font-family:'Space Grotesk';
    font-weight:700;
    font-size:8px;
    padding:2px 26px;
    transform:rotate(-40deg);
    letter-spacing:0.5px;
    opacity:0;
    transition:opacity .15s ease;
  }
  .cat-btn.selected{
    border-color:var(--gold);
    transform:translateY(-3px);
    box-shadow:0 10px 22px rgba(255,193,69,0.3);
  }
  .cat-btn.selected .poster-band{ opacity:1; }

  .poster-gk{ background:radial-gradient(circle at 30% 20%, #4A5AE8 0%, #1a1e4d 70%); }
  .poster-sci{ background:radial-gradient(circle at 30% 20%, #1FBF9F 0%, #0e3d3a 70%); }
  .poster-mov{ background:radial-gradient(circle at 30% 20%, #FF6B6B 0%, #4a1530 70%); }
  .poster-sports{ background:radial-gradient(circle at 30% 20%, #F5A623 0%, #4d2e05 70%); }
  .poster-history{ background:radial-gradient(circle at 30% 20%, #B08D57 0%, #3d2e17 70%); }
  .poster-geo{ background:radial-gradient(circle at 30% 20%, #2FA5D8 0%, #0d2e42 70%); }
  .poster-tech{ background:radial-gradient(circle at 30% 20%, #7B61FF 0%, #241a4d 70%); }
  .poster-animals{ background:radial-gradient(circle at 30% 20%, #6FBF4A 0%, #1e3d0e 70%); }
  .poster-food{ background:radial-gradient(circle at 30% 20%, #FF8A5C 0%, #4d2210 70%); }
  .poster-festivals{ background:radial-gradient(circle at 30% 20%, #E84C88 0%, #4d1230 70%); }
  .poster-music{ background:radial-gradient(circle at 30% 20%, #C864FA 0%, #33104d 70%); }
  .poster-space{ background:radial-gradient(circle at 30% 20%, #4a4ae8 0%, #0a0a2e 70%); }
  .poster-maths{ background:radial-gradient(circle at 30% 20%, #FF4B7E 0%, #4d0d24 70%); }
  .poster-hindi{ background:radial-gradient(circle at 30% 20%, #FFB347 0%, #4d3208 70%); }

  .play-btn{
    width:100%;
    padding:17px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg, var(--gold), #FF9A45);
    color:var(--navy-deep);
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.3px;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(255,193,69,0.35);
    transition:transform .15s ease;
  }
  .play-btn:active{ transform:scale(0.97); }

  /* ---------- QUIZ SCREEN ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:18px;
  }
  .mini-poster{
    width:34px; height:34px;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    border:1.5px solid rgba(255,255,255,0.15);
    flex-shrink:0;
  }
  .qcounter{
    font-family:'Space Grotesk';
    font-weight:700;
    font-size:14px;
    background:rgba(255,255,255,0.08);
    padding:6px 14px;
    border-radius:20px;
    color:var(--mint);
    flex:1;
    text-align:center;
  }
  .score-chip{
    font-family:'Space Grotesk';
    font-weight:700;
    font-size:14px;
    background:rgba(255,255,255,0.08);
    padding:6px 12px;
    border-radius:20px;
    white-space:nowrap;
  }

  .timer-ring{
    width:54px;
    height:54px;
    margin:0 auto 18px;
    position:relative;
  }
  .timer-ring svg{ transform:rotate(-90deg); }
  .timer-ring circle{
    fill:none;
    stroke-width:5;
  }
  .timer-track{ stroke:rgba(255,255,255,0.1); }
  .timer-bar{ stroke:var(--gold); stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s; }
  .timer-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:17px;
  }

  .q-card{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:24px 20px;
    margin-bottom:18px;
    min-height:110px;
    display:flex;
    align-items:center;
  }
  .q-eyebrow{
    position:absolute;
    font-family:'Space Grotesk';
    font-size:11px;
    letter-spacing:2px;
    color:var(--mint);
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:8px;
  }
  .q-text{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:700;
    line-height:1.35;
    width:100%;
  }

  .options{ display:flex; flex-direction:column; gap:11px; }
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(255,255,255,0.045);
    border:1.5px solid rgba(255,255,255,0.1);
    color:var(--ink);
    padding:15px 16px;
    border-radius:14px;
    font-size:15.5px;
    font-weight:500;
    text-align:left;
    cursor:pointer;
    transition:all .15s ease;
  }
  .opt .letter{
    width:26px; height:26px;
    border-radius:8px;
    background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:12.5px;
    flex-shrink:0;
  }
  .opt:not(.locked):active{ transform:scale(0.98); }
  .opt.correct{
    border-color:var(--mint);
    background:rgba(63,221,176,0.14);
  }
  .opt.correct .letter{ background:var(--mint); color:var(--navy-deep); }
  .opt.wrong{
    border-color:var(--coral);
    background:rgba(255,93,93,0.14);
  }
  .opt.wrong .letter{ background:var(--coral); color:#fff; }
  .opt.dim{ opacity:0.4; }

  /* ---------- RESULT SCREEN ---------- */
  .result-card{ text-align:center; padding:20px 6px; }
  .result-heading{
    font-family:'Archivo Black';
    font-size:15px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--coral);
    margin-bottom:6px;
    min-height:18px;
  }
  .result-emoji{ font-size:60px; margin-bottom:8px; display:block; }
  .result-score{
    font-family:'Archivo Black';
    font-size:52px;
    color:var(--gold);
    margin:6px 0 0;
    line-height:1;
  }
  .result-total{ color:var(--muted); font-size:15px; margin-bottom:6px; }
  .result-msg{
    font-family:'Space Grotesk';
    font-weight:700;
    font-size:19px;
    margin:14px 0 26px;
  }
  .result-bars{ display:flex; gap:5px; justify-content:center; margin:20px 0 28px; flex-wrap:wrap; }
  .result-stats{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin:20px 0 28px;
  }
  .stat-box{
    flex:1;
    min-width:70px;
    max-width:100px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:14px;
    padding:10px 4px;
  }
  .stat-num{
    font-family:'Space Grotesk';
    font-weight:700;
    font-size:18px;
  }
  .stat-label{
    font-size:10px;
    color:var(--muted);
    margin-top:2px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .ghost-btn{
    width:100%;
    padding:16px;
    border-radius:16px;
    background:transparent;
    border:1.5px solid rgba(255,255,255,0.18);
    color:var(--ink);
    font-family:'Space Grotesk';
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-top:10px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- START -->
  <div class="screen active" id="screen-start">
    <div class="start-card">
      <div class="top-controls">
        <button class="icon-toggle" id="soundToggle">🔊</button>
        <div class="lang-toggle" id="langToggle">
          <button class="lang-btn selected" data-lang="hi">हिं</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
      <span class="bolt">⚡</span>
      <h1 class="title" id="titleText">Dimaag Ki<br><span>Battery</span></h1>
      <p class="subtitle" id="subtitleText">10 sawaal · 15 second har ek · kitna charge hai dimaag?</p>

      <div class="cat-label" id="catLabelText">Category chuno</div>
      <div class="cat-grid" id="catGrid"></div>

      <button class="play-btn" id="startBtn">Shuru Karo →</button>
    </div>
  </div>

  <!-- QUIZ -->

      <div class="mini-poster" id="miniPoster"></div>

    <div class="high-score-row" id="highScoreRow">Best: 0</div>

    <div class="lives-row" id="livesRow"></div>

    <div class="timer-ring">
      <svg width="54" height="54">
        <circle class="timer-track" cx="27" cy="27" r="22"></circle>
        <circle class="timer-bar" id="timerBar" cx="27" cy="27" r="22" stroke-dasharray="138" stroke-dashoffset="0"></circle>
      </svg>
      <div class="timer-num" id="timerNum">15</div>
    </div>

    <div class="q-card">
      <div class="q-text" id="qText">Loading…</div>

    <div class="options" id="optionsWrap"></div>

    <button class="ghost-btn" id="finishBtn" style="margin-top:16px;">Khatam Karo</button>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="result-card">
      <div class="result-heading" id="resultHeading"></div>
      <span class="result-emoji" id="resultEmoji">🏆</span>
      <div class="result-score" id="resultScore">0</div>
      <div class="result-total" id="resultTotal">sahi jawab</div>
      <div class="result-msg" id="resultMsg">Shandaar!</div>
      <div class="result-stats" id="resultStats"></div>
      <button class="play-btn" id="retryBtn">Dobara Khelo</button>
      <button class="ghost-btn" id="changeCatBtn">Category Badlo</button>
    </div>
  </div>

</div>
